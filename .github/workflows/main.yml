# GitHub Action for generating a Dark Crimson contribution snake matching the AKIRA theme.
name: Generate Snake

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"

  # Allows manually triggering the workflow from the Actions tab
  workflow_dispatch:

  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Dark Crimson snake SVGs in './dist/'
        uses: Platane/snk/svg-only@v3
        id: snake-svg
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#dc2626&color_dots=#ebedf0,#fecaca,#f87171,#dc2626,#7f1d1d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#161b22,#450a0a,#7f1d1d,#dc2626,#f87171
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update AKIRA crimson snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
