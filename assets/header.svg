<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="AKIRA — Determination, Hope, Consistency">
  <defs>
    <!-- Rounded card clip -->
    <clipPath id="header-clip">
      <rect x="1" y="1" width="1198" height="538" rx="16" />
    </clipPath>

    <!-- Deep obsidian cinema base -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="45%" stop-color="#11090C" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>

    <!-- Subtle top-to-bottom spotlight vignette -->
    <radialGradient id="center-vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0D1117" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#05070B" stop-opacity="0.72" />
    </radialGradient>

    <!-- Drifting crimson aurora orbs -->
    <radialGradient id="orb-primary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.38" />
      <stop offset="42%" stop-color="#991B1B" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#450A0A" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-secondary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.26" />
      <stop offset="48%" stop-color="#7F1D1D" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#7F1D1D" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Celestial eclipse halo ring strokes -->
    <linearGradient id="ring-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.58" />
      <stop offset="28%" stop-color="#DC2626" stop-opacity="0.22" />
      <stop offset="62%" stop-color="#7F1D1D" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.36" />
    </linearGradient>

    <linearGradient id="ring-outer-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#991B1B" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#FCA5A5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.02" />
    </linearGradient>

    <!-- 3-layer liquid silk wave fills -->
    <linearGradient id="wave-fill-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#1A0608" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="wave-fill-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#22070A" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="wave-fill-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#450A0A" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#0D0608" stop-opacity="0.82" />
    </linearGradient>

    <!-- Silky glowing crimson shimmer sweeping across AKIRA -->
    <linearGradient id="akira-shimmer" x1="-500" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="28%" stop-color="#F8FAFC" />
      <stop offset="44%" stop-color="#FECACA" />
      <stop offset="50%" stop-color="#F87171" />
      <stop offset="56%" stop-color="#FECACA" />
      <stop offset="72%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
      <animate
        attributeName="x1"
        values="-650;1350"
        dur="5.6s"
        calcMode="spline"
        keySplines="0.42 0 0.58 1"
        repeatCount="indefinite"
      />
      <animate
        attributeName="x2"
        values="250;2250"
        dur="5.6s"
        calcMode="spline"
        keySplines="0.42 0 0.58 1"
        repeatCount="indefinite"
      />
    </linearGradient>

    <!-- Luminous accent hairline -->
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0" />
      <stop offset="22%" stop-color="#DC2626" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#FCA5A5" stop-opacity="1" />
      <stop offset="78%" stop-color="#DC2626" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle perimeter border gradient -->
    <linearGradient id="border-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#7F1D1D" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#30363D" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle dot texture -->
    <pattern id="dot-matrix" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.75" fill="#484F58" opacity="0.38" />
    </pattern>

    <!-- Soft atmospheric crimson glow filters -->
    <filter id="text-aura-outer" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="text-aura-inner" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>
    <filter id="node-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous closed-loop orbital aurora drift (zero stop/reverse seam) */
    .orb-a {
      animation: orbitA 22s linear infinite;
    }
    .orb-b {
      animation: orbitB 28s linear infinite;
    }
    .orb-c {
      animation: orbitC 19s linear infinite;
    }

    /* Smooth continuous eclipse ring rotations */
    .ring-cw {
      transform-origin: 600px 245px;
      animation: spinCW 42s linear infinite;
    }
    .ring-ccw {
      transform-origin: 600px 245px;
      animation: spinCCW 64s linear infinite;
    }

    /* Eternal seamless tiled parallax waves (period = 1200px, zero jump) */
    .wave-flow-back {
      animation: flowLeft 28s linear infinite;
    }
    .wave-flow-mid {
      animation: flowRight 20s linear infinite;
    }
    .wave-flow-front {
      animation: flowLeft 14s linear infinite;
    }

    /* Silky breathing title and aura */
    .title-group {
      animation: subtleFloat 7s ease-in-out infinite;
    }
    .aura-breathe {
      animation: auraPulse 5.6s ease-in-out infinite;
    }
    .line-breathe {
      transform-origin: 600px 294px;
      animation: dividerPulse 5.6s ease-in-out infinite;
    }
    .diamond-pulse {
      transform-origin: 600px 294px;
      animation: diamondGlow 5.6s ease-in-out infinite;
    }

    /* Soft drifting embers */
    .e1  { opacity: 0; animation: emberDrift 9s ease-in-out 0s infinite; }
    .e2  { opacity: 0; animation: emberDrift 11s ease-in-out 1.4s infinite; }
    .e3  { opacity: 0; animation: emberDrift 8.5s ease-in-out 2.8s infinite; }
    .e4  { opacity: 0; animation: emberDrift 12s ease-in-out 0.6s infinite; }
    .e5  { opacity: 0; animation: emberDrift 9.5s ease-in-out 4.1s infinite; }
    .e6  { opacity: 0; animation: emberDrift 10.5s ease-in-out 5.3s infinite; }
    .e7  { opacity: 0; animation: emberDrift 8.8s ease-in-out 2.0s infinite; }
    .e8  { opacity: 0; animation: emberDrift 11.5s ease-in-out 3.5s infinite; }
    .e9  { opacity: 0; animation: emberDrift 10s ease-in-out 6.2s infinite; }
    .e10 { opacity: 0; animation: emberDrift 9.2s ease-in-out 1.1s infinite; }

    @keyframes orbitA {
      0%   { transform: translate(0px, -24px); }
      25%  { transform: translate(115px, 0px); }
      50%  { transform: translate(0px, 24px); }
      75%  { transform: translate(-115px, 0px); }
      100% { transform: translate(0px, -24px); }
    }
    @keyframes orbitB {
      0%   { transform: translate(90px, 18px); }
      25%  { transform: translate(0px, -26px); }
      50%  { transform: translate(-90px, 18px); }
      75%  { transform: translate(0px, 32px); }
      100% { transform: translate(90px, 18px); }
    }
    @keyframes orbitC {
      0%   { transform: translate(-70px, -16px); }
      25%  { transform: translate(0px, 22px); }
      50%  { transform: translate(70px, -16px); }
      75%  { transform: translate(0px, -30px); }
      100% { transform: translate(-70px, -16px); }
    }
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes flowLeft {
      from { transform: translateX(0px); }
      to   { transform: translateX(-1200px); }
    }
    @keyframes flowRight {
      from { transform: translateX(-1200px); }
      to   { transform: translateX(0px); }
    }
    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-4px); }
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.36; }
      50%      { opacity: 0.78; }
    }
    @keyframes dividerPulse {
      0%, 100% { transform: scaleX(0.88); opacity: 0.65; }
      50%      { transform: scaleX(1.05); opacity: 1; }
    }
    @keyframes diamondGlow {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50%      { opacity: 1; transform: scale(1.18); }
    }
    @keyframes emberDrift {
      0%   { transform: translateY(38px); opacity: 0; }
      22%  { opacity: 0.72; }
      72%  { opacity: 0.4; }
      100% { transform: translateY(-78px); opacity: 0; }
    }
  </style>

  <g clip-path="url(#header-clip)">
    <!-- Base Obsidian Backdrop -->
    <rect width="1200" height="540" fill="url(#bg-base)" />

    <!-- Subtle Dot Texture -->
    <rect width="1200" height="540" fill="url(#dot-matrix)" />

    <!-- Smooth Orbiting Crimson Aurora Nebula -->
    <ellipse class="orb-a" cx="600" cy="245" rx="470" ry="240" fill="url(#orb-primary)" />
    <ellipse class="orb-b" cx="760" cy="300" rx="420" ry="215" fill="url(#orb-secondary)" />
    <ellipse class="orb-c" cx="440" cy="210" rx="340" ry="185" fill="url(#orb-highlight)" />

    <!-- Cinematic Vignette Depth -->
    <rect width="1200" height="540" fill="url(#center-vignette)" />

    <!-- Subtle Rotating Celestial Crimson Eclipse Rings -->
    <g class="ring-ccw" opacity="0.55">
      <circle cx="600" cy="245" r="236" fill="none" stroke="url(#ring-outer-grad)" stroke-width="1" stroke-dasharray="6 10" />
      <circle cx="836" cy="245" r="2.2" fill="#FCA5A5" filter="url(#node-glow)" />
    </g>

    <g class="ring-cw" opacity="0.72">
      <circle cx="600" cy="245" r="168" fill="none" stroke="url(#ring-inner-grad)" stroke-width="1.2" />
      <circle cx="600" cy="77" r="2.6" fill="#EF4444" filter="url(#node-glow)" />
      <circle cx="600" cy="413" r="1.8" fill="#FCA5A5" opacity="0.75" />
    </g>

    <!-- 3-Layer Seamless Flowing Liquid Crimson Silk Waves -->
    <!-- Back Wave (period 1200px, Y=432, A=34) -->
    <g class="wave-flow-back">
      <path
        d="M 0 432 C 220 398, 380 398, 600 432 C 820 466, 980 466, 1200 432 C 1420 398, 1580 398, 1800 432 C 2020 466, 2180 466, 2400 432 L 2400 560 L 0 560 Z"
        fill="url(#wave-fill-back)"
      />
      <path
        d="M 0 432 C 220 398, 380 398, 600 432 C 820 466, 980 466, 1200 432 C 1420 398, 1580 398, 1800 432 C 2020 466, 2180 466, 2400 432"
        fill="none"
        stroke="#EF4444"
        stroke-width="0.9"
        opacity="0.34"
      />
    </g>

    <!-- Mid Wave (period 1200px, Y=458, A=28, flowing opposite direction) -->
    <g class="wave-flow-mid">
      <path
        d="M 0 458 C 220 486, 380 486, 600 458 C 820 430, 980 430, 1200 458 C 1420 486, 1580 486, 1800 458 C 2020 430, 2180 430, 2400 458 L 2400 560 L 0 560 Z"
        fill="url(#wave-fill-mid)"
      />
      <path
        d="M 0 458 C 220 486, 380 486, 600 458 C 820 430, 980 430, 1200 458 C 1420 486, 1580 486, 1800 458 C 2020 430, 2180 430, 2400 458"
        fill="none"
        stroke="#FCA5A5"
        stroke-width="1"
        opacity="0.38"
      />
    </g>

    <!-- Front Wave (period 1200px, Y=484, A=22) -->
    <g class="wave-flow-front">
      <path
        d="M 0 484 C 220 462, 380 462, 600 484 C 820 506, 980 506, 1200 484 C 1420 462, 1580 462, 1800 484 C 2020 506, 2180 506, 2400 484 L 2400 560 L 0 560 Z"
        fill="url(#wave-fill-front)"
      />
      <path
        d="M 0 484 C 220 462, 380 462, 600 484 C 820 506, 980 506, 1200 484 C 1420 462, 1580 462, 1800 484 C 2020 506, 2180 506, 2400 484"
        fill="none"
        stroke="#F87171"
        stroke-width="1.15"
        opacity="0.45"
      />
    </g>

    <!-- Subtle Floating Luminous Embers -->
    <circle class="e1"  cx="165"  cy="390" r="1.5" fill="#FCA5A5" />
    <circle class="e2"  cx="290"  cy="425" r="1.2" fill="#EF4444" />
    <circle class="e3"  cx="420"  cy="375" r="1.4" fill="#F87171" />
    <circle class="e4"  cx="515"  cy="440" r="1.1" fill="#FFFFFF" />
    <circle class="e5"  cx="685"  cy="435" r="1.2" fill="#FCA5A5" />
    <circle class="e6"  cx="790"  cy="385" r="1.6" fill="#EF4444" />
    <circle class="e7"  cx="910"  cy="415" r="1.3" fill="#F87171" />
    <circle class="e8"  cx="1035" cy="395" r="1.5" fill="#FCA5A5" />
    <circle class="e9"  cx="235"  cy="230" r="1.0" fill="#FFFFFF" />
    <circle class="e10" cx="965"  cy="220" r="1.1" fill="#FCA5A5" />

    <!-- Centerpiece Animated AKIRA Typography -->
    <g class="title-group">
      <!-- Outer Breathing Crimson Halo -->
      <text
        class="aura-breathe"
        x="613"
        y="264"
        text-anchor="middle"
        font-family="'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="96"
        font-weight="800"
        letter-spacing="26"
        fill="#DC2626"
        filter="url(#text-aura-outer)"
      >AKIRA</text>

      <!-- Inner Tight Crimson Radiance -->
      <text
        x="613"
        y="264"
        text-anchor="middle"
        font-family="'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="96"
        font-weight="800"
        letter-spacing="26"
        fill="#EF4444"
        opacity="0.42"
        filter="url(#text-aura-inner)"
      >AKIRA</text>

      <!-- Foreground Metallic Silver-to-Crimson Shimmer Text -->
      <text
        x="613"
        y="264"
        text-anchor="middle"
        font-family="'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="96"
        font-weight="800"
        letter-spacing="26"
        fill="url(#akira-shimmer)"
      >AKIRA</text>
    </g>

    <!-- Symmetrical Luminous Hairline & Center Diamond -->
    <rect class="line-breathe" x="380" y="293" width="440" height="1.6" rx="1" fill="url(#accent-line)" />
    <polygon class="diamond-pulse" points="600,289 605,294 600,299 595,294" fill="#FCA5A5" filter="url(#node-glow)" />

    <!-- Motto Tagline -->
    <text
      x="603"
      y="336"
      text-anchor="middle"
      font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
      font-size="13.5"
      font-weight="500"
      letter-spacing="5.2"
      fill="#CBD5E1"
    >DETERMINATION<tspan fill="#EF4444">  ·  </tspan>HOPE<tspan fill="#EF4444">  ·  </tspan>CONSISTENCY</text>
  </g>

  <!-- Crisp Minimal Outer Border (No Corner Brackets) -->
  <rect x="1" y="1" width="1198" height="538" rx="16" fill="none" stroke="url(#border-sheen)" stroke-width="1.2" />
</svg>
